{% extends 'base.html' %}
{% load static %}
{% load i18n %}
{% block title %}{% trans "Add Brand" %} — IMS{% endblock %}
{% block content %}
<div class="page-header">
  <h1><span class="header-icon"><i class="fas fa-plus"></i></span>{% trans "Add Brand" %}</h1>
 
</div>
<div class="ims-card" style="max-width:600px">
  <div class="ims-card-body">
    <form id="addBrandForm" action="{% url 'add_brand' %}" method="post">
      {% csrf_token %}
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="brand_name" class="form-label">{% trans "Brand Name" %} <span class="text-danger">*</span></label>
          <input type="text" id="brand_name" name="brand_name" class="form-control" required placeholder="{% trans 'Enter brand name' %}">
        </div>
        <div class="col-md-6">
          <label for="code" class="form-label">{% trans "Brand Code" %}</label>
          <input type="text" id="code" name="code" class="form-control" value="{{ next_code }}" readonly>
          <div class="form-text">{% trans "Auto-generated code" %}</div>
        </div>
      </div>
      <div class="mb-4">
        <label for="brand_description" class="form-label">{% trans "Description" %}</label>
        <textarea id="brand_description" name="brand_description" class="form-control" rows="3" placeholder="{% trans 'Enter description (optional)' %}"></textarea>
      </div>
      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> {% trans "Add Brand" %}</button>
        <a href="{% url 'view_brand' %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
