{% extends "base.html" %}
{% load static %}
{% load i18n %}
{% block title %}{% trans "Update Product" %} — IMS{% endblock %}
{% block content %}
<div class="page-header">
  <h1><span class="header-icon"><i class="fas fa-pen"></i></span>{% trans "Update Product" %}</h1>
  <a href="{% url 'view_product' %}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> {% trans "Back" %}</a>
</div>
<div class="ims-card" style="max-width:760px">
  <div class="ims-card-body">
    <form method="POST">
      {% csrf_token %}
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="product_name" class="form-label">{% trans "Product Name" %} <span class="text-danger">*</span></label>
          <input type="text" id="product_name" name="product_name" class="form-control" required value="{{ product.name }}">
        </div>
        <div class="col-md-6">
          <label for="product_code" class="form-label">{% trans "Product Code" %}</label>
          <input type="text" id="product_code" name="product_code" class="form-control" required value="{{ product.code }}">
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label for="product_category" class="form-label">{% trans "Category" %} <span class="text-danger">*</span></label>
          <select id="product_category" name="product_category" class="form-control" required>
            {% for category in categories %}<option value="{{ category.id }}" {% if category == product.category %}selected{% endif %}>{{ category.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label for="product_brand" class="form-label">{% trans "Brand" %} <span class="text-danger">*</span></label>
          <select id="product_brand" name="product_brand" class="form-control" required>
            {% for brand in brands %}<option value="{{ brand.id }}" {% if brand == product.brand %}selected{% endif %}>{{ brand.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label for="product_group" class="form-label">{% trans "Product Group" %} <span class="text-danger">*</span></label>
          <select id="product_group" name="product_group" class="form-control" required>
            {% for group in productgroups %}<option value="{{ group.id }}" {% if group == product.product_group %}selected{% endif %}>{{ group.name }} ({{ group.brand.name }})</option>{% endfor %}
          </select>
        </div>
      </div>
      <div class="mb-4">
        <label for="product_description" class="form-label">{% trans "Description" %}</label>
        <textarea id="product_description" name="product_description" class="form-control" rows="3">{{ product.description }}</textarea>
      </div>
      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> {% trans "Update Product" %}</button>
        <a href="{% url 'view_product' %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
