{% extends 'base.html' %}
{% load static %}
{% load i18n %}
{% block title %}{% trans "Add Category" %} — IMS{% endblock %}
{% block content %}
<div class="page-header">
  <h1><span class="header-icon"><i class="fas fa-plus"></i></span>{% trans "Add Category" %}</h1>
  
</div>
<div class="ims-card" style="max-width:560px">
  <div class="ims-card-body">
    <form id="addCategoryForm" action="{% url 'add_category' %}" method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="category_name" class="form-label">{% trans "Category Name" %} <span class="text-danger">*</span></label>
        <input type="text" id="category_name" name="category_name" class="form-control" required placeholder="{% trans 'Enter category name' %}">
      </div>
      <div class="mb-4">
        <label for="category_description" class="form-label">{% trans "Description" %}</label>
        <textarea id="category_description" name="category_description" class="form-control" rows="3" placeholder="{% trans 'Enter description (optional)' %}"></textarea>
      </div>
      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> {% trans "Add Category" %}</button>
        <a href="{% url 'view_category' %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
