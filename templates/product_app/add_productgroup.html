{% extends "base.html" %}
{% load static %}
{% load i18n %}
{% block title %}{% trans "Add Product Group" %} — IMS{% endblock %}
{% block content %}
<div class="page-header">
  <h1><span class="header-icon"><i class="fas fa-plus"></i></span>{% trans "Add Product Group" %}</h1>
  
</div>
<div class="ims-card" style="max-width:700px">
  <div class="ims-card-body">
    <form method="POST">
      {% csrf_token %}
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="group_name" class="form-label">{% trans "Group Name" %} <span class="text-danger">*</span></label>
          <input type="text" id="group_name" name="group_name" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label for="group_code" class="form-label">{% trans "Group Code" %}</label>
          <input type="text" id="group_code" name="group_code" class="form-control" value="{{ next_code }}" readonly>
          <div class="form-text">{% trans "Auto-generated product group code" %}</div>
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="group_category" class="form-label">{% trans "Category" %} <span class="text-danger">*</span></label>
          <select id="group_category" name="group_category" class="form-control" required>
            <option value="">{% trans "-- Select Category --" %}</option>
            {% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label for="group_brand" class="form-label">{% trans "Brand" %} <span class="text-danger">*</span></label>
          <select id="group_brand" name="group_brand" class="form-control" required>
            <option value="">{% trans "-- Select Brand --" %}</option>
            {% for brand in brands %}<option value="{{ brand.id }}">{{ brand.name }}</option>{% endfor %}
          </select>
        </div>
      </div>
      <div class="mb-4">
        <label for="group_description" class="form-label">{% trans "Description" %}</label>
        <textarea id="group_description" name="group_description" class="form-control" rows="3"></textarea>
      </div>
      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> {% trans "Add Product Group" %}</button>
        <a href="{% url 'view_productgroup' %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
